name: Publish to PyPI

# Trigger ONLY when you push a version tag: git tag v0.1.4 && git push origin v0.1.4
# Never triggers on branch pushes — no commit-back, no conflicts.
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for trusted publishing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Extract version from tag
        id: version
        run: |
          # Tag is refs/tags/v0.1.4 — strip the leading v
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=$TAG" >> $GITHUB_OUTPUT
          echo "Publishing version: $TAG"

      - name: Stamp version into source
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml
          sed -i "s/__version__ = .*/__version__ = \"$VERSION\"/" src/contineo/__init__.py

      - name: Build
        run: uv build

      - name: Publish to PyPI
        run: uv publish --check-url https://pypi.org/simple/contineo/
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
